<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgendaStyle · Reservar cita</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="booking.css" />
  </head>
  <body>
    <main class="booking-page">
      <section class="booking-card">
        <div class="booking-brand"><img src="Agendastyle_logo.png" alt="AgendaStyle" /></div>
        <div class="booking-heading"><span class="eyebrow">RESERVA EN LÍNEA</span><h1 id="booking-title">Solicita tu cita</h1><p>Completa tus datos y elige el horario que prefieras.</p></div>
        <form id="booking-form" novalidate>
          <div class="form-grid"><label>Nombres<input name="nombres" type="text" placeholder="Tus nombres" required /></label><label>Apellidos<input name="apellidos" type="text" placeholder="Tus apellidos" required /></label></div>
          <div class="form-grid"><label>Teléfono<input name="telefono" type="tel" placeholder="300 000 0000" required /></label><label>Correo<input name="email" type="email" placeholder="correo@ejemplo.com" required /></label></div>
          <div class="form-grid"><label>Servicio<select name="servicioId" id="booking-service" required><option value="">Cargando servicios...</option></select></label><label>Estilista<select name="estilistaId" id="booking-stylist" required><option value="">Cargando estilistas...</option></select></label></div>
          <div class="form-grid"><label>Fecha<input name="fecha" id="booking-date" type="date" required /></label><label>Hora<input name="hora" type="time" min="08:00" max="19:00" required /></label></div>
          <label>Observaciones <span>(opcional)</span><textarea name="observaciones" rows="3" placeholder="¿Tienes alguna solicitud especial?"></textarea></label>
          <button class="booking-button" type="submit">Solicitar cita <b>→</b></button>
          <p id="booking-message" class="booking-message" role="status"></p>
        </form>
        <a class="admin-link" href="auth.html">¿Eres administrador? Inicia sesión</a>
      </section>
    </main>
    <script src="booking.js"></script>
  </body>
</html>
